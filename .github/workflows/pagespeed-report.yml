name: PageSpeed Report

# 10:00 IST = 04:30 UTC, Mon/Wed/Fri. Adjust the hour if you want a
# different run time, keep the day list "1,3,5" for Mon/Wed/Fri.
on:
  schedule:
    - cron: "30 4 * * 1,3,5"
  workflow_dispatch: {}
  
jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run PageSpeed report
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_TASK_ID: ${{ secrets.CLICKUP_TASK_ID }}
          POWER_AUTOMATE_WEBHOOK_URL: ${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}
        run: python scripts/run_report.py
