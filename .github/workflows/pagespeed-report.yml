name: PageSpeed Report

on:
  schedule:
    # 09:00 IST = 03:30 UTC, Mon/Wed/Fri. Adjust the hour if you want a
    # different run time, keep the day list "1,3,5" for Mon/Wed/Fri.
    - cron: "30 3 * * 1,3,5"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run PageSpeed report
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_TASK_ID: ${{ secrets.CLICKUP_TASK_ID }}
          POWER_AUTOMATE_WEBHOOK_URL: ${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}
        run: python scripts/run_report.py
